[package]
name = "vm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
classfile = { path = "../classfile" }
platform = { path = "../platform" }

[features]
# The interpreter's sampling profiler (crates/vm/src/prof). Never on in a
# shipped build: `cargo build --release -p launcher --features vm/prof`.
prof = []

# Executable memory for the JIT (crates/vm/src/jit/mem.rs), already in the
# tree through mio.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory", "Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }
