[package]
name = "natives-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# The `lazy.ui` natives (docs/ui.md), kept out of `natives` so the plain
# `lazyvm` binary never links xui: only `launcher-ui` depends on this crate.
[dependencies]
vm = { path = "../vm" }
natives = { path = "../natives", default-features = false }
xui-bind = { path = "../xui-bind" }
