[package]
name = "launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "lazyvm"
path = "src/main.rs"

[dependencies]
vm = { path = "../vm" }
natives = { path = "../natives", default-features = false }
platform = { path = "../platform" }
classfile = { path = "../classfile" }

[features]
default = ["desktop", "ui"]
# `lazy.gfx` desktop windows (docs/gfx.md); `--no-default-features` builds a
# smaller VM whose windows are headless only.
desktop = ["natives/desktop"]
# `lazy.ui` on xui (docs/ui.md, "Size"): `--no-default-features --features
# desktop` measures the VM without it.
ui = ["natives/ui"]
