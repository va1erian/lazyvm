# LazyOS-only parts of LazyVM (decisions.md D2, D10): `lazyvm-ui` for LazyOS,
# whose `lazy.ui` windows are xuid clients through `xui-app`'s
# `LazyOSBackend`. It links LazyOS's GPL code, so it is GPL-3.0-or-later, the
# one such crate, and nothing else depends on it.
#
# It is its own workspace, outside LazyVM's: it builds only for
# x86_64-unknown-linux-musl and needs a LazyOS checkout, reached through the
# `build/lazyos-checkout` link `tools/lazyos_ui.py --lazyos <checkout>` makes (outside
# this crate, or cargo would take xui-app for a member). That tool is the one
# way to build it.
[package]
name = "lazyvm-lazyos"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[[bin]]
name = "lazyvm-ui"
path = "src/main.rs"

[dependencies]
launcher = { path = "../launcher", default-features = false }
natives-ui = { path = "../natives-ui" }
# The same revision as LazyOS's `xui-app` and LazyVM's `xui-bind`, so one
# `xui_core` links.
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "832c61f29419bf31a0518a47e050b15c97b316e3", default-features = false }
xui-app = { path = "../../build/lazyos-checkout/xui-app" }

[lints.rust]
unsafe_code = "deny"

# As LazyVM's own release profile (its Cargo.toml says why), so sizes compare.
[profile.release]
debug = 1
codegen-units = 1
panic = "unwind"

# Third-party crates are built for size: in `lazyvm-ui` they are xui and its
# text stack, most of the binary (docs/ui.md, "Size"). At full speed stay our
# own crates, the ones the VM leans on (inflate for jars and java.util.zip,
# CRCs, libm for StrictMath, mio for sockets) and the rasteriser, which paints
# every frame: built for size it made a repaint 2.3 times slower.
[profile.release.package."*"]
opt-level = "z"
[profile.release.package.flate2]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.adler2]
opt-level = 3
[profile.release.package.simd-adler32]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.libm]
opt-level = 3
[profile.release.package.mio]
opt-level = 3
[profile.release.package.tiny-skia]
opt-level = 3
[profile.release.package.tiny-skia-path]
opt-level = 3
[profile.release.package.zeno]
opt-level = 3
[profile.release.package.swash]
opt-level = 3
