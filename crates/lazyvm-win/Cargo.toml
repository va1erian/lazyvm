[package]
name = "lazyvm-win"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Windows-only parts (decisions.md D10): the `lazy.ui` window host on xui's
# winit backend (feature `ui`), and the error message box, which `lazyvm`
# uses without xui for windowed bundles (docs/bundle.md). Depended on for
# Windows only, so the musl build never pulls winit in; on other targets, as a
# workspace member, it builds to nothing. Same xui revision as `xui-bind`
# (docs/ui.md).
[target.'cfg(windows)'.dependencies]
xui-core = { git = "https://github.com/va1erian/xui", rev = "832c61f29419bf31a0518a47e050b15c97b316e3", optional = true }
xui-canvas = { git = "https://github.com/va1erian/xui", rev = "832c61f29419bf31a0518a47e050b15c97b316e3", default-features = false, features = ["winit-backend"], optional = true }
# MessageBoxW for the uncaught-exception box; the version winit already links.
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["ui"]
ui = ["dep:xui-core", "dep:xui-canvas"]
