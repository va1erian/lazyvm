name: fuzz

# S8-03: an hour of each target, weekly. A crash fails the run and keeps its input as an artifact.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parser, verifier]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: fuzz
        run: cargo fuzz run ${{ matrix.target }} --fuzz-dir fuzz fuzz/corpus/${{ matrix.target }} -- -max_total_time=3600 -rss_limit_mb=4096 -timeout=120
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
